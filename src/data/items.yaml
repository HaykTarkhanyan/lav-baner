# ---------------------------------------------------------------- jokes & sayings

- id: esh-kerel-poch-mnacel
  section: sayings
  armenian: true
  text: Էշը կերել, պոչը մնացել
  translation: The donkey's been eaten, only the tail is left.
  meaning: The job is almost done; only a small bit remains.
  topics: [proverb, donkey]

- id: esh-mi-satki
  section: sayings
  armenian: true
  text: Էշ մի սատկի, գարուն ա գալիս
  translation: Don't die, donkey, spring is coming.
  meaning: Said of promises of better times that will come too late to help.
  topics: [proverb, donkey]

- id: esh-cexic-hanel
  section: sayings
  armenian: true
  text: Էշը ցեխից հանել
  translation: To pull the donkey out of the mud.
  meaning: To finally get a stuck job done, with a lot of effort.
  topics: [proverb, donkey]

- id: eshi-akanjin-qnac
  section: sayings
  armenian: true
  text: Էշի ականջին քնած
  translation: Asleep on the donkey's ear.
  meaning: Completely unaware of what is going on.
  topics: [proverb, donkey]

- id: eshn-inch-giti-nushy
  section: sayings
  armenian: true
  text: Էշն ինչ գիտի նուշը ինչ ա
  translation: What does a donkey know about almonds?
  meaning: Some people can't appreciate a good thing. Pearls before swine.
  topics: [proverb, donkey]

- id: mer-eshn-a
  section: sayings
  armenian: true
  text: Էշ ա, բայց դե մեր էշն ա
  translation: He's a donkey, but he's our donkey.
  meaning: Flawed, but one of us.
  topics: [proverb, donkey]

- id: mi-caghkov-garun
  section: sayings
  armenian: true
  text: Մի ծաղկով գարուն չի գա
  translation: One flower doesn't bring spring.
  meaning: One good sign doesn't mean things have changed. One swallow doesn't make a summer.
  topics: [proverb]

- id: urishi-harsi-tutuzov
  section: sayings
  armenian: true
  text: Ուրիշի հարսի տուտուզով փեսուն լավություն անել
  translation: To do the groom a favor with someone else's bride's backside.
  topics: [proverb]

- id: mati-u-matanu-arank
  section: sayings
  armenian: true
  text: Մտնել մատի ու մատանու արանքը
  translation: To get between the finger and the ring.
  topics: [proverb]

- id: sev-sirt-vardaguyn-trusik
  section: sayings
  armenian: true
  text: Իմ սև սիրտ, քո վարդագույն տռուսիկ
  translation: My black heart, your pink underpants.
  meaning: A mock-romantic line. It means nothing, which is the point.
  topics: [proverb]

- id: karmir-kovy
  section: sayings
  armenian: true
  text: Կարմիր կովը կաշին չի փոխում
  translation: The red cow doesn't change its hide.
  meaning: People don't change their nature. A leopard can't change its spots.
  topics: [proverb]

- id: voch-mi-lav-gorc
  section: sayings
  armenian: true
  text: Ոչ մի լավ գործ անպատիժ չի մնում
  translation: No good deed goes unpunished.
  meaning: The same as in English.
  topics: [proverb]

- id: tan-el-che
  section: sayings
  armenian: true
  text: Թան էլ չէ, փրթած մածուն
  translation: Not even tan (a yogurt drink), but curdled matsun (yogurt).
  topics: [proverb]

- id: vaghy-che-myus-ory
  section: sayings
  armenian: true
  text: Վաղը չէ մյուս օրը
  translation: Not tomorrow, the other day.
  meaning: How Armenian says "the day after tomorrow".
  topics: [language]

- id: trashov-antrash
  section: sayings
  armenian: true
  text: Թրաշով ու անթրաշ
  translation: '"With stubble" and "unshaven".'
  meaning: Opposite-looking words that mean the same thing, like "flammable" and "inflammable".
  topics: [language]

- id: tasnerord-hark
  section: sayings
  armenian: true
  text: "1-ին և 10-րդ հարկերից ընկնելու տարբերությունը. 10-րդ հարկից՝ «Աաաաա՜, դը՛խկ», 1-ին հարկից՝ «Դը՛խկ, աաաաա՜»"
  translation: 'The difference between falling from the 10th floor and the 1st. From the 10th: "Aaaaah! Thud." From the 1st: "Thud. Aaaaah!"'
  topics: [joke]

