- id: metric-academy
  section: learn
  armenian: true
  name: "Metric Academy: Python, math and ML course"
  description:
    en: Free Armenian-language course in Python, the math behind machine learning, and machine learning itself, from the basics to neural networks and LLMs. Lectures run live on Zoom and are recorded on YouTube; materials and homework are on the site.
    hy: Անվճար հայալեզու դասընթաց Python-ի, մեքենայական ուսուցման մաթեմատիկայի և հենց մեքենայական ուսուցման մասին՝ հիմունքներից մինչև նեյրոնային ցանցեր և LLM-ներ։ Դասերն անցնում են Zoom-ով և ձայնագրվում YouTube-ում, նյութերն ու տնայինները կայքում են։
  topics: [programming, math, ai, course, free]
  links:
    website: https://hayktarkhanyan.github.io/python_math_ml_course/
    youtube: https://www.youtube.com/@MetricAcademy
    telegram: https://t.me/metric_academy
    github: https://github.com/HaykTarkhanyan/python_math_ml_course

