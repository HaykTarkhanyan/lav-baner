- id: esh-kerel-poch-mnacel
  section: sayings
  armenian: true
  text: Էշը կերել, պոչը մնացել
  translation: The donkey's been eaten, only the tail is left.
  meaning: The job is almost done; only a small bit remains.
  topics: [proverb, donkey]

- id: esh-mi-satki
  section: sayings
  armenian: true
  text: Էշ մի սատկի, գարուն ա գալիս
  translation: Don't die, donkey, spring is coming.
  meaning: Said of promises of better times that will come too late to help.
  topics: [proverb, donkey]

- id: esh-cexic-hanel
  section: sayings
  armenian: true
  text: Էշը ցեխից հանել
  translation: To pull the donkey out of the mud.
  meaning: To finally get a stuck job done, with a lot of effort.
  topics: [proverb, donkey]

- id: eshi-akanjin-qnac
  section: sayings
  armenian: true
  text: Էշի ականջին քնած
  translation: Asleep on the donkey's ear.
  meaning: Completely unaware of what is going on.
  topics: [proverb, donkey]

- id: eshn-inch-giti-nushy
  section: sayings
  armenian: true
  text: Էշն ինչ գիտի նուշը ինչ ա
  translation: What does a donkey know about almonds?
  meaning: Some people can't appreciate a good thing. Pearls before swine.
  topics: [proverb, donkey]

- id: mer-eshn-a
  section: sayings
  armenian: true
  text: Էշ ա, բայց դե մեր էշն ա
  translation: He's a donkey, but he's our donkey.
  meaning: Flawed, but one of us.
  topics: [proverb, donkey]

- id: mi-caghkov-garun
  section: sayings
  armenian: true
  text: Մի ծաղկով գարուն չի գա
  translation: One flower doesn't bring spring.
  meaning: One good sign doesn't mean things have changed. One swallow doesn't make a summer.
  topics: [proverb]

- id: urishi-harsi-tutuzov
  section: sayings
  armenian: true
  text: Ուրիշի հարսի տուտուզով փեսուն լավություն անել
  translation: To do the groom a favor with someone else's bride's backside.
  topics: [proverb]

- id: mati-u-matanu-arank
  section: sayings
  armenian: true
  text: Մտնել մատի ու մատանու արանքը
  translation: To get between the finger and the ring.
  topics: [proverb]

- id: sev-sirt-vardaguyn-trusik
  section: sayings
  armenian: true
  text: Իմ սև սիրտ, քո վարդագույն տռուսիկ
  translation: My black heart, your pink underpants.
  meaning: A mock-romantic line. It means nothing, which is the point.
  topics: [proverb]

- id: karmir-kovy
  section: sayings
  armenian: true
  text: Կարմիր կովը կաշին չի փոխում
  translation: The red cow doesn't change its hide.
  meaning: People don't change their nature. A leopard can't change its spots.
  topics: [proverb]

- id: voch-mi-lav-gorc
  section: sayings
  armenian: true
  text: Ոչ մի լավ գործ անպատիժ չի մնում
  translation: No good deed goes unpunished.
  meaning: The same as in English.
  topics: [proverb]

- id: tan-el-che
  section: sayings
  armenian: true
  text: Թան էլ չէ, փրթած մածուն
  translation: Not even tan (a yogurt drink), but curdled matsun (yogurt).
  topics: [proverb]

- id: vaghy-che-myus-ory
  section: sayings
  armenian: true
  text: Վաղը չէ մյուս օրը
  translation: Not tomorrow, the other day.
  meaning: How Armenian says "the day after tomorrow".
  topics: [language]

- id: trashov-antrash
  section: sayings
  armenian: true
  text: Թրաշով ու անթրաշ
  translation: '"With stubble" and "unshaven".'
  meaning: Opposite-looking words that mean the same thing, like "flammable" and "inflammable".
  topics: [language]

- id: tasnerord-hark
  section: sayings
  armenian: true
  text: "1-ին և 10-րդ հարկերից ընկնելու տարբերությունը. 10-րդ հարկից՝ «Աաաաա՜, դը՛խկ», 1-ին հարկից՝ «Դը՛խկ, աաաաա՜»"
  translation: 'The difference between falling from the 10th floor and the 1st. From the 10th: "Aaaaah! Thud." From the 1st: "Thud. Aaaaah!"'
  topics: [joke]

- id: sery-lobu-jur-chi
  section: sayings
  armenian: true
  text: Սերը լոբու ջուր չի, կքամվի կգնա
  translation: Love isn't bean water, that you drain and it's gone.
  meaning: Love doesn't just go away.
  topics:
  - proverb

- id: popok-tnkoghy
  section: sayings
  armenian: true
  text: Պոպոկ տնկողը պոպոկ չի ուտում
  translation: The one who plants a walnut tree doesn't eat its walnuts.
  meaning: We plant for those who come after us.
  topics:
  - proverb

- id: kyachalin-sanr
  section: sayings
  armenian: true
  text: Քյաչալին ինչ ա պետք, մի հատ սանր
  translation: What does a bald man need? A comb.
  meaning: Said of a gift or offer that is no use to the person who gets it.
  topics:
  - proverb

- id: shnic-maz-pokel
  section: sayings
  armenian: true
  text: Շնից մազ պոկելն էլ ա քյար
  translation: Even plucking a hair from a dog is a gain.
  meaning: Get whatever little you can out of a hopeless case.
  topics:
  - proverb

- id: sery-atarin
  section: sayings
  armenian: true
  text: Սերը աթարին էլ ա կպնում
  translation: Love sticks even to dried dung.
  meaning: Love is blind.
  topics:
  - proverb

- id: eghunq-unes
  section: sayings
  armenian: true
  text: Եղունք ունես, գլուխդ քորի
  translation: If you have nails, scratch your own head.
  meaning: Don't wait for others to do it for you.
  topics:
  - proverb

- id: gety-chtrac-hop
  section: sayings
  armenian: true
  text: Գետը չթռած հոպ մի ասա
  translation: Don't say 'hop' before you've jumped the river.
  meaning: Don't count your chickens before they hatch.
  topics:
  - proverb

- id: dzu-goghacoghy
  section: sayings
  armenian: true
  text: Ձու գողացողը ձի էլ կգողանա
  translation: He who steals an egg will steal a horse too.
  meaning: Small dishonesty grows.
  topics:
  - proverb

- id: amenakarch-chanaparh
  section: sayings
  armenian: true
  text: Ամենակարճ ճանապարհը նա ա, որը գիտես
  translation: The shortest road is the one you know.
  meaning: Stick with what you know.
  topics:
  - proverb

- id: nver-dziu-atamner
  section: sayings
  armenian: true
  text: Նվեր տված ձիու ատամներին չեն նայում
  translation: You don't look at the teeth of a gifted horse.
  meaning: Same as in English.
  topics:
  - proverb

- id: dzri-uqsusn
  section: sayings
  armenian: true
  text: Ձրի, ուքսուսն էլ ա քաղցր
  translation: When it's free, even vinegar is sweet.
  meaning: People love anything free.
  topics:
  - proverb

- id: es-agha-du-agha
  section: sayings
  armenian: true
  text: Ես աղա, դու աղա, բա մեր աղունն ո՞վ աղա
  translation: I'm a master, you're a master, so who will grind our flour?
  meaning: 'Wordplay: աղա means both master and grind. Everyone wants to be the boss.'
  topics:
  - proverb
  - language

- id: sari-pes-tgha
  section: sayings
  armenian: true
  text: Սարի պես տղա էր, դառավ ռագատկի քար
  translation: He was a lad like a mountain, now he's a slingshot pebble.
  topics:
  - proverb

- id: tan-chi-amen-mardu
  section: sayings
  armenian: true
  text: … թան չի, ամեն մարդու բան չի
  translation: … it's not tan, it's not for everyone.
  topics:
  - proverb

- id: izolent
  section: sayings
  armenian: true
  text: Բոլոր պրոբլեմները, որ իզոլենտով չեն լուծվում, լուծվում են շատ իզոլենտով
  translation: Every problem duct tape can't fix is fixed by more duct tape.
  topics:
  - joke

- id: srti-karol
  section: sayings
  armenian: true
  text: Սրտի կառոլը միակ կառոլն ա, որ բեղեր չունի
  translation: The king of hearts is the only king without a mustache.
  meaning: A true fact about playing cards.
  topics:
  - joke

- id: dzer-khndrel
  section: sayings
  armenian: true
  text: Գնում ենք ձեռ խնդրելու, հարսի հերն ասում ա՝ ինչի՞ ձեր տղեն ձեռ չունի, ասում են՝ ունի, հոգնել ա ուղղակի
  translation: We go to ask for her hand; the bride's father asks why our son has no hand; they say he has one, he's just tired.
  meaning: A joke on ձեռք խնդրել, to ask for someone's hand in marriage.
  topics:
  - joke
  - language

